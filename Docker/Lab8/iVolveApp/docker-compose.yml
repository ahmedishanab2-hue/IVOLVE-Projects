services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ivolveapp:latest
    container_name: ivolve-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_User: root
      DB_password: root123
      DB_NAME: ivolve
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ivolve-net
    restart: unless-stopped
  db:
    image: mysql:8.0
    container_name: ivolve-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ivolve
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net
    restart: unless-stopped

networks:
  ivolve-net:
    name: ivolve-net
    driver: bridge

volumes:
  app_logs:
  db_data:

